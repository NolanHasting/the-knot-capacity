name: Remove merged branches
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'NolanHasting/theknotcapacity'
    runs-on: ubuntu-latest
    steps:
      - name: Delete local branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's merged PR metadata correctly handles squash merges where
          # git merge-base --is-ancestor is insufficient.
          mapfile -t merged_branches < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 200 \
              --json headRefName,baseRefName,isCrossRepository \
              --jq '.[] | select(.baseRefName == "main" and .isCrossRepository == false) | .headRefName'
          )
          for branch in "${merged_branches[@]}"; do
            case "$branch" in
              feature/*|fix/*) ;;
              *) continue ;;
            esac
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting merged branch: $branch"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            fi
          done


  prune-backups:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prune backups covered by two newer production snapshots
        shell: bash
        run: |
          set -euo pipefail
          backups=$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/backup/)
          cutoff=$(sed -nE 's|^backup/production-([0-9]{4}-[0-9]{2}-[0-9]{2})(-.*)?$|\1|p' <<< "$backups" | sort -ru | sed -n '2p')
          [[ -n "$cutoff" ]] || exit 0
          while IFS= read -r branch; do
            [[ "$branch" =~ -([0-9]{4}-[0-9]{2}-[0-9]{2})(-.*)?$ ]] || continue
            [[ "${BASH_REMATCH[1]}" < "$cutoff" ]] || continue
            tip=$(git rev-parse "origin/$branch")
            git merge-base --is-ancestor "$tip" origin/main || continue
            git push --force-with-lease="refs/heads/$branch:$tip" origin ":refs/heads/$branch"
          done <<< "$backups"
